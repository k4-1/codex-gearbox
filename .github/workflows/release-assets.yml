name: Release assets

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild and upload
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Wait for GitHub release
        shell: bash
        run: |
          : "${TAG:?TAG is required}"
          for attempt in $(seq 1 12); do
            if gh api --silent "repos/${GH_REPO}/releases/tags/${TAG}" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 5
          done
          echo "GitHub release not found: ${TAG}" >&2
          gh api "repos/${GH_REPO}/releases/tags/${TAG}"
      - name: Upload release binaries
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            extension=".exe"
          else
            extension=""
          fi
          cp "target/$TARGET/release/codex-gearbox$extension" "codex-gearbox-$TARGET$extension"
          cp "target/$TARGET/release/shift$extension" "shift-$TARGET$extension"
          cp "target/$TARGET/release/gearbox-shift$extension" "gearbox-shift-$TARGET$extension"
          gh release upload "$TAG" \
            --repo "$GH_REPO" \
            "codex-gearbox-$TARGET$extension" \
            "shift-$TARGET$extension" \
            "gearbox-shift-$TARGET$extension" \
            --clobber

  package-manifests:
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: gh release view "$TAG" --repo "$GH_REPO" --json tagName,assets > release.json
      - run: python3 scripts/update_package_manifests.py release.json
      - name: Commit package manifests
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Formula/codex-gearbox.rb bucket/codex-gearbox.json
          git commit -m "chore(packaging): update $TAG"
          git push
      - name: Publish npm packages
        if: ${{ env.NPM_TOKEN != '' }}
        uses: actions/setup-node@v4
        with:
          registry-url: https://registry.npmjs.org
      - name: Upload npm packages
        if: ${{ env.NPM_TOKEN != '' }}
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
        run: node scripts/publish_npm_packages.mjs "$TAG"
