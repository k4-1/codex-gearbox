[package]
name = "codex-gearbox"
version = "0.5.1"
edition = "2024"
rust-version = "1.85"
description = "Plan-aware model and reasoning router for Codex"
license = "MIT"
keywords = ["codex", "openai", "cli", "router"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "codex-gearbox"
path = "src/main.rs"

[[bin]]
name = "shift"
path = "src/shift.rs"

[[bin]]
name = "gearbox-shift"
path = "src/gearbox_shift.rs"

[dependencies]
anyhow = "1"
directories = "6"
futures-util = "0.3"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = "0.28"

[profile.release]
lto = "thin"
strip = true
